<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logos Sovereign Master Core - Telemetry Cockpit</title>
    <style>
        body { margin: 0; background: #050508; color: #00ffcc; font-family: monospace; overflow: hidden; }
        #hud { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 1px solid #00ffcc; padding: 20px; border-radius: 6px; pointer-events: none; width: 320px; box-shadow: 0 0 15px rgba(0,255,204,0.2); }
        h1 { margin: 0 0 10px 0; font-size: 16px; letter-spacing: 2px; border-bottom: 1px solid #00ffcc; padding-bottom: 5px; }
        .metric { margin: 8px 0; font-size: 13px; }
        .label { color: #88ffcc; }
    </style>
</head>
<body>
    <div id="hud">
        <h1>LOGOS SOVEREIGN CORE</h1>
        <div class="metric"><span class="label">Author:</span> The Architect</div>
        <div class="metric"><span class="label">Status:</span> <span id="status">Connecting...</span></div>
        <div class="metric"><span class="label">Energy Density:</span> <span id="density">0.00</span></div>
        <div class="metric"><span class="label">Wallet Balance:</span> <span id="balance">0.00</span> LUFF</div>
        <div class="metric"><span class="label">Active Peers:</span> <span id="peers">0</span></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const particleCount = 1200;
        const posArray = new Float32Array(particleCount * 3);
        for(let i = 0; i < particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const material = new THREE.PointsMaterial({ size: 0.03, color: 0x00ffcc });
        const particleMesh = new THREE.Points(geometry, material);
        scene.add(particleMesh);
        camera.position.z = 5;

        const ws = new WebSocket("ws://127.0.0.1:8765");
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            document.getElementById("status").innerText = data.status;
            document.getElementById("density").innerText = data.manifold_state.energy_density.toFixed(4);
            document.getElementById("balance").innerText = data.ledger_state.balance.toFixed(2);
            document.getElementById("peers").innerText = data.ledger_state.active_peers_count;
            
            particleMesh.rotation.y += 0.001 * (data.manifold_state.energy_density * 0.1 + 1);
        };

        function animate() {
            requestAnimationFrame(animate);
            particleMesh.rotation.x += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
